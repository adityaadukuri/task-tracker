<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Task Tracker</title>

    <link
        rel="stylesheet"
        href="style.css"
    >
</head>

<body>

    <div class="container">

        <h1>Task Tracker</h1>

        <!-- ========================= -->
        <!-- CREATE TASK FORM -->
        <!-- ========================= -->

        <section class="form-section">

            <h2>Create Task</h2>

            <form id="taskForm">

                <div class="form-group">

                    <label for="name">
                        Task Name
                    </label>

                    <input
                        type="text"
                        id="name"
                        placeholder="Enter task name"
                        required
                    >

                </div>


                <div class="form-group">

                    <label for="description">
                        Description
                    </label>

                    <textarea
                        id="description"
                        placeholder="Enter task description"
                    ></textarea>

                </div>


                <div class="form-group">

                    <label for="owner">
                        Owner
                    </label>

                    <input
                        type="text"
                        id="owner"
                        placeholder="Enter owner name"
                        required
                    >

                </div>


                <div class="form-group">

                    <label for="due_date">
                        Due Date
                    </label>

                    <input
                        type="datetime-local"
                        id="due_date"
                        required
                    >

                </div>


                <div class="form-group">

                    <label for="status">
                        Status
                    </label>

                    <select id="status">

                        <option value="pending">
                            Pending
                        </option>

                        <option value="in_progress">
                            In Progress
                        </option>

                        <option value="completed">
                            Completed
                        </option>

                    </select>

                </div>


                <button
                    type="submit"
                    class="add-button"
                >
                    Add Task
                </button>

            </form>

        </section>


        <!-- ========================= -->
        <!-- TASK LIST -->
        <!-- ========================= -->

        <section class="tasks-section">

            <div class="tasks-header">

                <h2>Tasks</h2>

                <button
                    onclick="loadTasks()"
                    class="refresh-button"
                >
                    Refresh
                </button>

            </div>


            <div id="taskList">

                <p class="loading">
                    Loading tasks...
                </p>

            </div>

        </section>

    </div>


    <script src="script.js"></script>

</body>

</html>
